services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmf
      POSTGRES_PASSWORD: mmf
      POSTGRES_DB: mmf
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mmf']
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build: .
    container_name: resolve-conflicts-pr-${PR_NUMBER:-0}
    entrypoint: ['resolve-conflicts-entrypoint.sh']
    env_file: .env
    environment:
      - PR_NUMBER=${PR_NUMBER}
      - DATABASE_URL=postgresql://mmf:mmf@db:5432/mmf?sslmode=disable
      - JWT_SECRET=test-jwt-secret-for-conflict-resolution
    volumes:
      - ./logs/resolve-conflicts/${PR_NUMBER:-default}:/workspace/logs
    mem_limit: 4g
    cpus: 2
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
