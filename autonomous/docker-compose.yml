services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmf
      POSTGRES_PASSWORD: mmf
      POSTGRES_DB: mmf
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmf"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:latest
    command: up
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../server/db:/db
    environment:
      DATABASE_URL: postgresql://mmf:mmf@db:5432/mmf

  agent:
    build: .
    container_name: ${CONTAINER_NAME:-autonomous-agent}
    env_file: .env
    environment:
      - MILESTONE_NUMBER=${MILESTONE_NUMBER}
      - ISSUE_NUMBER=${ISSUE_NUMBER}
      - ISSUE_TITLE=${ISSUE_TITLE}
      - BASE_BRANCH=${BASE_BRANCH}
      - BRANCH=${BRANCH}
    volumes:
      - ./logs/${ISSUE_NUMBER:-default}/screenshots:/screenshots
      - ./logs/${ISSUE_NUMBER:-default}:/workspace/logs
    mem_limit: 4g
    cpus: 2
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
